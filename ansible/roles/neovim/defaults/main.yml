---
neovim:
  version: v0.11.0
  arch: x86_64
node_version: "lts"
home_dir: "{{ ansible_env.HOME }}"
tmp_dir: /tmp
pacman_packages:
  - python
  - python-pip
  - virtualenv
  - ruby
  - base-devel
  - curl
  - perl
  - cpanminus
  - gnupg
  - nodejs
  - npm
  - xclip
  - xsel
apt_packages:
  - python3
  - python3-pip
  - virtualenv
  - python-is-python3
  - ruby
  - ruby-dev
  - build-essential
  - curl
  - perl
  - cpanminus
  - gnupg2
  - xclip
  - xsel
  - universal-ctags
base_env: "{{ home_dir }}/.venv"
