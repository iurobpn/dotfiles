- name: Install system packages
  apt:
    name: "{{ apt_packages }}"
    state: latest
    update_cache: true
  # when: ansible_facts.ansible_pkg_mgr == "apt"
  become: yes

- name: Add Neovim nightly PPA
  apt_repository:
    repo: ppa:neovim-ppa/unstable
    state: present
  become: yes
  # when: ansible_facts.ansible_pkg_mgr == "apt"

- name: Install Neovim
  apt:
    name: 
    - neovim
    state: latest
    update_cache: yes
  become: yes

  # when: ansible_facts.ansible_pkg_mgr == "apt"

# - name: Install Neovim
#   pacman:
#     name: 
#     - neovim
  # when: ansible_facts.ansible_pkg_mgr == "pacman"


- name: Install Node.js Neovim provider
  npm:
    name: neovim
    global: yes
    state: latest

- name: Install Ruby Neovim provider
  gem:
    name: neovim
    state: latest
    user_install: no

# create a virtualenv for python3
- name: Create virtualenv for python3
  shell: |
    virtualenv .env/base
  args:
    chdir: /root
    creates: /root/.env/base/bin/activate

- name: Check if base_env is created
  stat:
    path: /root/.env/base/bin/activate
  register: venv_activate

- name: Install neovim package in virtual environment
  pip:
    name: neovim
    virtualenv: /root/.env/base
  when: venv_activate.stat.exists

- name: Check if cpanm is available
  stat:
    path: /usr/local/bin/cpanm
  register: cpanm_check

# install Neovim::Ext using cpanm
- name: Install Neovim::Ext using cpanm
  cpanm:
    name: Neovim::Ext
    state: latest
  when: cpanm_check.stat.exists

