# This playbook installs the python provider for ansible
- name: Install python packages
  apt:
    name: 
      - python3
      - python3-pip
      - python3-venv
      - virtualenv
    state: latest
    update_cache: true
  become: yes

# create a virtualenv for python3
- name: Create virtualenv for python3
  shell: |
    virtualenv .env/base
  args:
    chdir: "{{ home_dir }}"
    creates: "{{ home_dir }}/.env/base/bin/activate"

- name: Check if base_env is created
  stat:
    path: "{{ home_dir }}/.env/base/bin/activate"
  register: venv_activate

- name: Install neovim package in virtual environment
  pip:
    name: neovim
    virtualenv: "{{ home_dir }}/.env/base"
  when: venv_activate.stat.exists

