# This playbook installs the python provider for ansible
- name: Install python packages on Debian-based systems
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - virtualenv
    state: latest
    update_cache: true
  become: yes
  when: ansible_os_family == "Debian"

- name: Install python packages on archlinux
  pacman:
    name:
      - python
      - python-pip
      - python-virtualenv
    state: latest
    update_cache: true
  become: yes
  when: ansible_os_family == "Archlinux"

# create a virtualenv for python3
- name: Create virtualenv for python
  shell: |
    virtualenv {{ base_env }}
  args:
    chdir: "{{ home_dir }}"
    creates: "{{ base_env }}/bin/activate"

- name: Check if base_env is created
  stat:
    path: "{{ base_env }}/bin/activate"
  register: venv_activate

- name: Install neovim package in virtual environment
  shell: |
    "{{ base_env }}/bin/activate"
    pip install neovim
  args:
    executable: /bin/bash
  when: venv_activate.stat.exists

