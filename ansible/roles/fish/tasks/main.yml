---

#
- name: Update cache and add dependencies
  apt:
    name:
      - curl
      - gnupg2
    state: latest

# Add official Fish PPA and install Fish shell
- name: Add Fish shell PPA
  apt_repository:
    repo: ppa:fish-shell/release-4
    state: present

- name: Install Fish shell
  apt:
    name:
      - fish
    state: latest
    update_cache: true

- name: Ensure fisher plugin manager is installed
  shell: |
    fish -c 'curl -sL https://git.io/fisher | source && fisher install jorgebucaran/fisher'
  args:
    creates: "{{ ansible_env.HOME }}/.config/fish/functions/fisher.fish"

- name: Install Fish plugins using fisher
  shell: fish -c 'fisher install {{ item }}'
  loop: "{{ fish_plugins }}"
