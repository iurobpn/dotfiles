---
- name: "Install luarocks dependencies"
  apt:
    name:
      - build-essential
      - libreadline-dev
      - unzip
    state: latest
    update_cache: true

# Compile and install Luarocks
- name: Download Luarocks source
  get_url:
    url: "https://luarocks.github.io/luarocks/releases/luarocks-{{ luarocks_version }}.tar.gz"
    dest: "{{ tmp_dir }}/luarocks-{{ luarocks_version }}.tar.gz"

- name: Extract Luarocks source
  unarchive:
    src: "{{ tmp_dir }}/luarocks-{{ luarocks_version }}.tar.gz"
    dest: "{{ tmp_dir }}"
    remote_src: yes

- name: Compile and install Luarocks
  shell: |
    cd {{ tmp_dir }}/luarocks-{{ luarocks_version }} && ./configure --with-lua-include=/usr/local/include && make && make install
  args:
    creates: "/usr/local/bin/luarocks"  # Adjust if needed

- name: Install dependencies of luarocks target packages
  apt:
    name:
      - libssl-dev
      - libsqlite3-dev
      - git
    state: latest

- name: Install Lua packages from rockspec
  command: luarocks install --deps-only "{{ lua_rockspec_path }}"

