---
# tasks/main.yml for the rust role
- name: Check if rustup is installed
  command: rustup --version
  register: rustup_check
  ignore_errors: yes

- name: Install rustup (Rust and Cargo) if not installed
  shell: |
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
  args:
    executable: /usr/bin/bash
  when: rustup_check.rc != 0

- name: Ensure Cargo bin path is in the user's PATH (for future tasks)
  lineinfile:
    path: "{{ ansible_env.HOME }}/.bashrc"
    regexp: '(^export PATH=.*\$HOME/.cargo/bin)'
    line: 'export PATH="$HOME/.cargo/bin:$PATH"'
    create: yes
  when: ansible_env.HOME is defined

