---
# tasks file for ghostty

# 
- name: Download Ghostty ubuntu binary
  get_url:
    url: "https://github.com/mkasberg/ghostty-ubuntu/releases/download/{{ ghostty.version }}-ppa1/ghostty_{{ ghostty.version }}.ppa1_{{ ghostty.arch }}_{{ghostty.os}}.deb"
    dest: "{{ tmp_dir }}/ghostty.deb"
  become: yes

- name: Check if ghostty.deb is available
  stat:
    path: "{{ tmp_dir }}/ghostty.deb"
  register: ghostty_deb

- name: Install ghostty
  shell: |
    dpkg -i {{ tmp_dir }}/ghostty.deb
  become: yes
  register: ghostty_install
  when: ghostty_deb.stat.exists
  ignore_errors: yes

- name: install ghostty dependencies
  shell: |
    apt install --fix-broken --yes
  become: yes
  when: ghostty_install is failed


