---

# Install Rust using rustup if rustc is not found.
- name: Install Rust via rustup (non-interactive)
  shell: "curl --proto '=https' --tlsv1.2 -sSf {{ rustup_install_script_url }} | sh -s -- -y"
  args:
    executable: /usr/bin/bash
    creates: /root/.cargo/env

- name: Update rustup
  shell: |
    rustup update
  args:
    executable: /usr/bin/bash

# Ensure that the Cargo bin directory is available in the PATH for subsequent commands.
# This is achieved by sourcing the cargo environment file.
- name: Install Cargo packages
  shell: "source $HOME/.cargo/env && cargo install {{ item }} {{ cargo_install_flags }}"
  args:
    executable: /bin/bash
  loop: "{{ cargo_packages }}"
  # Optionally, you can add a check to skip if the package is already installed.
  # This simple example installs each package regardless.

- name: Install Cargo packages
  shell: ". /root/.cargo/env && cargo install {{ item }} {{ cargo_install_flags }}"
  args:
    executable: /bin/bash
  loop: "{{ cargo_packages }}"
  environment:
    PATH: "/root/.cargo/bin:{{ ansible_env.PATH }}"



    # Ansible Documentation: Search for topics on environment variables in Ansible tasks and shell vs. command modules. Look for notes on how Ansible spawns new processes for each task.

    # Docker Documentation: Look for sections on interactive vs. non-interactive mode to understand how Docker treats shell sessions differently when you attach interactively versus running commands via an orchestration tool like Ansible.

